name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-regressions:
    name: Complete native CPU regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install template reference dependency
        run: python -m pip install "Jinja2==3.1.6"

      - name: Check release asset contract and CUDA installer controls
        run: |
          python -m unittest discover -s tests -p test_release_assets.py -v
          python -m unittest discover -s tests -p test_cuda_linux_setup.py -v

      - name: Configure native regression build
        run: >-
          cmake -S . -B build-release-checks
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DGGML_NATIVE=OFF
          -DESE_QWEN4EXP_PROBE_GATE=OFF
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_SERVER=ON

      - name: Build complete registered targets
        run: cmake --build build-release-checks --parallel 2

      - name: Require the complete native suite to pass
        run: ctest --test-dir build-release-checks --output-on-failure

  linux-studio:
    name: Build Linux Studio packages
    needs: native-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            cuda: "OFF"
          - variant: cuda
            cuda: "ON"
    env:
      CC: gcc-12
      CXX: g++-12
      CUDAHOSTCXX: g++-12
      ESE_RUNTIME_BUILD_DIR: ${{ github.workspace }}/build-release-runtime
      ESE_PACKAGE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches Studio version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          python3 .github/scripts/verify-release-version.py --expected "$expected"

      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          gcc-12 g++-12 ninja-build
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          desktop-file-utils
          patchelf
          file
          xdg-utils
          rpm

      - name: Install pinned Linux CUDA and NCCL build components
        if: matrix.variant == 'cuda'
        run: python3 .github/scripts/setup-cuda-linux.py --root "$RUNNER_TEMP/ese-cuda-12.8"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri
          shared-key: release-linux-${{ matrix.variant }}

      - name: Restore Linux native build cache
        uses: actions/cache@v4
        with:
          path: build-release-runtime
          key: ese-linux-${{ matrix.variant }}-cuda12.8-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'ggml/**', 'include/**', 'src/**', 'common/**', 'examples/CMakeLists.txt', 'examples/server/**', 'vendor/**', '.github/scripts/setup-cuda-linux.py', '.github/scripts/cuda-linux-12.8.lock.json') }}

      - name: Build bundled ESE runtime
        env:
          CUDA_ENABLED: ${{ matrix.cuda }}
        run: |
          cuda_args=()
          if [ "$ESE_PACKAGE_VARIANT" = cuda ]; then
            cuda_args+=("-DCMAKE_CUDA_ARCHITECTURES=75-real;86-real;86-virtual")
          fi
          cmake -S . -B "$ESE_RUNTIME_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
            -DGGML_CUDA="$CUDA_ENABLED" -DESE_QWEN4EXP_PROBE_GATE=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON "${cuda_args[@]}"
          if [ "$ESE_PACKAGE_VARIANT" = cuda ]; then
            grep -q '^NCCL_LIBRARIES:FILEPATH=.*libnccl' "$ESE_RUNTIME_BUILD_DIR/CMakeCache.txt"
          fi
          cmake --build "$ESE_RUNTIME_BUILD_DIR" --target llama-server --parallel 2

      - name: Build packages
        working-directory: studio
        env:
          # linuxdeploy's bundled strip cannot read modern ELF RELR sections.
          NO_STRIP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          pnpm install --frozen-lockfile
          pnpm package:linux --bundles appimage,deb,rpm

      - name: Prepare Linux assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/collect-release-assets.py \
            --platform linux --variant "$ESE_PACKAGE_VARIANT" --version "$version" \
            --source-commit "$GITHUB_SHA" --runtime-root studio/runtime/ese \
            --bundle-root studio/src-tauri/target/release/bundle \
            --output release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.variant }}
          path: release-assets/*
          if-no-files-found: error

  windows-studio:
    name: Build Windows Studio installers
    needs: native-regressions
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          # Restored build markers must resolve before ancestry checks.
          fetch-depth: 0

      - name: Verify tag matches Studio version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:RELEASE_TAG.Substring(1)
          python .\.github\scripts\verify-release-version.py --expected $expected
          if ($LASTEXITCODE -ne 0) { throw "Release versions do not match $env:RELEASE_TAG" }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - name: Capture Windows CUDA build cache key
        id: windows-cuda-key
        shell: pwsh
        env:
          ESE_NATIVE_CACHE_KEY: ese-windows-cuda-v2-${{ runner.os }}-cuda12.4-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'ggml/**', 'include/**', 'src/**', 'common/**', 'examples/CMakeLists.txt', 'examples/server/**', 'vendor/**', '.github/scripts/setup-cuda-windows.ps1', '.github/scripts/prepare-restored-build.py') }}
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "key=$env:ESE_NATIVE_CACHE_KEY"

      - name: Restore exact Windows CUDA runtime build
        id: windows-cuda-cache
        uses: actions/cache@v4
        with:
          path: build-package
          key: ${{ steps.windows-cuda-key.outputs.key }}
          restore-keys: |
            ese-windows-cuda-v2-${{ runner.os }}-cuda12.4-
            ese-windows-cuda-v1-${{ runner.os }}-cuda12.4-

      - name: Install CUDA toolkit
        shell: pwsh
        run: .\.github\scripts\setup-cuda-windows.ps1

      - name: Install Ninja
        if: steps.windows-cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ninja -y

      - name: Prepare restored Windows CUDA build
        if: steps.windows-cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: python .\.github\scripts\prepare-restored-build.py --build-root .\build-package --fallback-base "$env:PREVIOUS_HEAD"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Build bundled ESE CUDA runtime
        if: steps.windows-cuda-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build-package -G "Ninja Multi-Config" -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DESE_QWEN4EXP_PROBE_GATE=OFF "-DCMAKE_CUDA_ARCHITECTURES=75-real;86-real;86-virtual" "-DCMAKE_CUDA_FLAGS=--threads=2" -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build-package --config Release --target llama-server -j 2
          python .github\scripts\prepare-restored-build.py --build-root build-package --record

      - name: Build separate driver-independent Windows CPU runtime
        working-directory: .
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build-package-cpu -G "Visual Studio 17 2022" -A x64 -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DESE_QWEN4EXP_PROBE_GATE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build-package-cpu --config Release --target llama-server --parallel 2

      - name: Build standalone Windows ESE launcher
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
          python -m PyInstaller --noconfirm --clean --onefile --name ese --paths . --hidden-import tools.ese --distpath dist --workpath build-pyinstaller --specpath build-pyinstaller ese
          .\dist\ese.exe --version

      - name: Check Windows CPU fallback selection and verification controls
        working-directory: .
        run: python -m unittest tests.test_ese_launcher.LauncherTests.test_packaged_windows_cpu_selection_before_cuda_binary_load tests.test_ese_launcher.LauncherTests.test_packaged_windows_cpu_selection_preserves_explicit_binary_overrides tests.test_ese_launcher.LauncherTests.test_packaged_windows_cpu_selection_rejects_cuda_payload_in_cpu_directory tests.test_windows_runtime_verify

      - name: Build installers
        working-directory: studio
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles msi
          pnpm tauri build --bundles nsis

      - name: Verify CUDA runtime in installer staging
        shell: pwsh
        run: |
          python .\.github\scripts\verify-windows-runtime.py --runtime-root .\studio\runtime\ese --build-root .\build-package --cpu-build-root .\build-package-cpu
          if ($LASTEXITCODE -ne 0) { throw "Staged Windows runtime verification failed" }
          .\studio\runtime\ese\ese.exe doctor --json
          if ($LASTEXITCODE -ne 0) { throw "ESE runtime doctor failed" }

          $driverDll = Join-Path $env:SystemRoot "System32\nvcuda.dll"
          $hasNvidiaDriver = (Test-Path -LiteralPath $driverDll) -or [bool](Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue)
          if ($hasNvidiaDriver) {
            .\studio\runtime\ese\build\bin\llama-server.exe --version
            if ($LASTEXITCODE -ne 0) { throw "CUDA llama-server smoke test failed" }
          } else {
            Write-Host "NVIDIA driver unavailable; PE dependency checks passed and executable smoke test was skipped."
          }

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python .\.github\scripts\collect-release-assets.py --platform windows --version $version --source-commit $env:GITHUB_SHA --runtime-root .\studio\runtime\ese --bundle-root .\studio\src-tauri\target\release\bundle --output release-assets
          if ($LASTEXITCODE -ne 0) { throw "Release asset collection failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux-studio, windows-studio]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate complete package matrix and generate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 .github/scripts/prepare-release-assets.py \
            --version "$version" --repository "$REPOSITORY" \
            --source-commit "$GITHUB_SHA" --assets release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Expert Streaming Engine ${RELEASE_TAG}" \
            --notes-file "$notes"
