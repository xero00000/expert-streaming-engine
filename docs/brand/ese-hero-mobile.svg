<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">ESE — Bigger AI. The PC you already own.</title>
  <desc id="desc">Put your SSD, RAM and GPU to work together for supported sparse AI models.</desc>
  <rect width="760" height="760" rx="24" fill="#171b1b"/>
  <g transform="translate(44 44)">
    <rect width="60" height="60" rx="14" fill="#dededf"/>
    <path d="M17 14H44V22H27V27H42V34H27V38H45V46H17Z" fill="#1d1e20"/>
    <text x="82" y="33" fill="#f4f6f4" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700">ESE</text>
    <text x="82" y="57" fill="#b6c4bd" font-family="DejaVu Sans, sans-serif" font-size="15" letter-spacing="1.5">EXPERT STREAMING ENGINE</text>
  </g>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="40" y="249" fill="#f4f6f4" font-size="100" font-weight="700" letter-spacing="-5">Bigger AI.</text>
    <text x="40" y="365" fill="#a7f3ce" font-size="100" font-weight="700" letter-spacing="-5">Your PC.</text>
    <text x="44" y="427" fill="#d0dad4" font-size="28">Put your whole PC to work.</text>
