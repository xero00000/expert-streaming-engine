name: ESE Studio CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "studio/**"
      - "ese"
      - "ese.cmd"
      - "tools/ese.py"
      - "CMakeLists.txt"
      - "ggml/**"
      - "src/**"
      - "common/**"
      - "examples/server/**"
      - "telemetry/**"
      - "benchmarks/**"
      - "COMMUNITY_BENCHMARKS.md"
      - "scripts/publish-community-benchmarks.mjs"
      - ".github/workflows/studio-ci.yml"
      - ".github/workflows/publish-community-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ese-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio frontend, Rust, and Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          desktop-file-utils
          patchelf
          rpm
          xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled ESE CPU runtime
        working-directory: .
        run: >-
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_SERVER=ON
          && cmake --build build-package --target llama-server -j2

      - name: Check installer shell syntax
        run: |
          bash -n install.sh scripts/install-local.sh
          ./install.sh --check

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build DEB and RPM packages
        run: pnpm tauri build --bundles deb,rpm --config src-tauri/tauri.unsigned.conf.json

      - name: Install and smoke-test DEB package
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          test -x /usr/bin/ese-studio
          find /usr -path '*/ese/ese' -type f -print -quit | grep -F /ese/ese
          find /usr -path '*/ese/build/bin/llama-server' -type f -print -quit | grep -F /ese/build/bin/llama-server
          desktop-file-validate "/usr/share/applications/ESE Studio.desktop"
          set +e
          WEBKIT_DISABLE_DMABUF_RENDERER=1 timeout --kill-after=3s 12s xvfb-run -a /usr/bin/ese-studio
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124

      - name: Inspect RPM package contents
        run: |
          rpm -qpl src-tauri/target/release/bundle/rpm/*.rpm | grep -F /usr/bin/ese-studio
          rpm -qpl src-tauri/target/release/bundle/rpm/*.rpm | grep -F ".desktop"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ese-studio-linux-packages
          path: |
            studio/src-tauri/target/release/bundle/deb/*.deb
            studio/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows-studio:
    name: Studio frontend, Rust, and Windows installers
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install CUDA toolkit
        working-directory: .
        shell: pwsh
        run: .\.github\scripts\setup-cuda-windows.ps1

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled ESE CPU + CUDA runtime
        working-directory: .
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build-package -G "Ninja Multi-Config" -DGGML_CUDA=ON -DGGML_NATIVE=OFF "-DCMAKE_CUDA_ARCHITECTURES=61;70;75;80;86;89" -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build-package --config Release --target llama-server -j 4

      - name: Build standalone Windows ESE launcher
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
          python -m PyInstaller --noconfirm --clean --onefile --name ese --paths . --hidden-import tools.ese --distpath dist --workpath build-pyinstaller --specpath build-pyinstaller ese
          .\dist\ese.exe --version

      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; exit 1 }
          .\install.ps1 -Check

      - name: Build frontend
        run: pnpm build

      - name: Verify staged Windows runtime
        shell: pwsh
        run: |
          if (-not (Test-Path runtime\ese\ese.exe)) { throw "standalone ese.exe was not staged" }
          if (-not (Test-Path runtime\ese\build\bin\llama-server.exe)) { throw "llama-server.exe was not staged" }
          if (-not (Get-ChildItem runtime\ese\build\bin\cudart64_*.dll)) { throw "CUDA runtime was not staged" }
          if (-not (Get-ChildItem runtime\ese\build\bin\cublas64_*.dll)) { throw "cuBLAS runtime was not staged" }
          if ((Get-Content runtime\ese\build\bin\ese-runtime.json | ConvertFrom-Json).cuda -ne $true) { throw "CUDA runtime manifest was not staged" }
          if (-not (Select-String -Path ..\build-package\CMakeCache.txt -Pattern '^GGML_CUDA:BOOL=ON$')) { throw "runtime was not configured with CUDA" }
          .\runtime\ese\ese.exe doctor --json
          .\runtime\ese\build\bin\llama-server.exe --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS and MSI installers
        run: pnpm tauri build --bundles nsis,msi --config src-tauri/tauri.unsigned.conf.json

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ese-studio-windows-installers
          path: |
            studio/src-tauri/target/release/bundle/nsis/*.exe
            studio/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  collector:
    name: Benchmark collector and publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telemetry/collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telemetry/collector/package-lock.json

      - name: Install locked collector dependencies
        run: npm ci

      - name: Check bindings, types, tests, and Worker bundle
        run: npm run check

      - name: Verify committed community benchmark rendering
        working-directory: .
        run: |
          node scripts/publish-community-benchmarks.mjs
          git diff --exit-code -- COMMUNITY_BENCHMARKS.md
