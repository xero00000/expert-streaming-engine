name: ESE Studio CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "studio/**"
      - "ese"
      - "ese.cmd"
      - "tools/ese.py"
      - "tools/hardware_profile.py"
      - "CMakeLists.txt"
      - "ggml/**"
      - "src/**"
      - "common/**"
      - "examples/server/**"
      - "telemetry/**"
      - "benchmarks/**"
      - "COMMUNITY_BENCHMARKS.md"
      - "scripts/publish-community-benchmarks.mjs"
      - ".github/workflows/studio-ci.yml"
      - ".github/workflows/publish-community-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ese-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio frontend, Rust, and Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          desktop-file-utils
          patchelf
          rpm
          xvfb

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled ESE CPU runtime
        working-directory: .
        run: >-
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_SERVER=ON
          && cmake --build build-package --target llama-server -j2

      - name: Check installer shell syntax
        run: |
          bash -n install.sh scripts/install-local.sh
          ./install.sh --check

      - name: Build frontend
        run: pnpm build

      - name: Test frontend utilities
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build DEB and RPM packages
        run: pnpm package:linux --bundles deb,rpm --config src-tauri/tauri.unsigned.conf.json

      - name: Install and smoke-test DEB package
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          test -x /usr/bin/ese-studio
          find /usr -path '*/ese/ese' -type f -print -quit | grep -F /ese/ese
          find /usr -path '*/ese/build/bin/llama-server' -type f -print -quit | grep -F /ese/build/bin/llama-server
          desktop-file-validate "/usr/share/applications/ESE Studio.desktop"
          set +e
          WEBKIT_DISABLE_DMABUF_RENDERER=1 timeout --kill-after=3s 12s xvfb-run -a /usr/bin/ese-studio
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124

      - name: Inspect RPM package contents
        run: |
          rpm -qpl src-tauri/target/release/bundle/rpm/*.rpm | grep -F /usr/bin/ese-studio
          rpm -qpl src-tauri/target/release/bundle/rpm/*.rpm | grep -F ".desktop"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ese-studio-linux-packages
          path: |
            studio/src-tauri/target/release/bundle/deb/*.deb
            studio/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows-studio:
    name: Studio frontend, Rust, and Windows installers
    runs-on: windows-2022
    # A cold CUDA 12.4 build takes just under two hours on the hosted runner.
    # Leave enough time to verify and preserve it for later PR updates.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          # Restored build markers must resolve before ancestry checks.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - name: Capture Windows CUDA build cache key
        id: windows-cuda-key
        shell: pwsh
        env:
          ESE_NATIVE_CACHE_KEY: ese-windows-cuda-v2-${{ runner.os }}-cuda12.4-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'ggml/**', 'include/**', 'src/**', 'common/**', 'examples/CMakeLists.txt', 'examples/server/**', 'vendor/**', '.github/scripts/setup-cuda-windows.ps1', '.github/scripts/prepare-restored-build.py') }}
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "key=$env:ESE_NATIVE_CACHE_KEY"

      - name: Restore exact Windows CUDA runtime build
        id: windows-cuda-cache
        uses: actions/cache@v4
        with:
          path: build-package
          key: ${{ steps.windows-cuda-key.outputs.key }}
          restore-keys: |
            ese-windows-cuda-v2-${{ runner.os }}-cuda12.4-
            ese-windows-cuda-v1-${{ runner.os }}-cuda12.4-

      - name: Install CUDA toolkit
        working-directory: .
        shell: pwsh
        run: .\.github\scripts\setup-cuda-windows.ps1

      - name: Install Ninja
        if: steps.windows-cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ninja -y

      - name: Prepare restored Windows CUDA build
        if: steps.windows-cuda-cache.outputs.cache-hit != 'true'
        working-directory: .
        shell: pwsh
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: python .\.github\scripts\prepare-restored-build.py --build-root .\build-package --fallback-base "$env:PREVIOUS_HEAD"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled ESE CUDA runtime
        if: steps.windows-cuda-cache.outputs.cache-hit != 'true'
        working-directory: .
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build-package -G "Ninja Multi-Config" -DGGML_CUDA=ON -DGGML_NATIVE=OFF "-DCMAKE_CUDA_ARCHITECTURES=75-real;86-real;86-virtual" "-DCMAKE_CUDA_FLAGS=--threads=2" -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build-package --config Release --target llama-server -j 2
          python .github\scripts\prepare-restored-build.py --build-root build-package --record

      - name: Build separate driver-independent Windows CPU runtime
        working-directory: .
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build-package-cpu -G "Visual Studio 17 2022" -A x64 -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DESE_QWEN4EXP_PROBE_GATE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build-package-cpu --config Release --target llama-server --parallel 2

      - name: Build standalone Windows ESE launcher
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
          python -m PyInstaller --noconfirm --clean --onefile --name ese --paths . --hidden-import tools.ese --distpath dist --workpath build-pyinstaller --specpath build-pyinstaller ese
          .\dist\ese.exe --version

      - name: Check Windows CPU fallback selection and verification controls
        working-directory: .
        run: python -m unittest tests.test_ese_launcher.LauncherTests.test_packaged_windows_cpu_selection_before_cuda_binary_load tests.test_ese_launcher.LauncherTests.test_packaged_windows_cpu_selection_preserves_explicit_binary_overrides tests.test_ese_launcher.LauncherTests.test_packaged_windows_cpu_selection_rejects_cuda_payload_in_cpu_directory tests.test_windows_runtime_verify

      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; exit 1 }
          .\install.ps1 -Check

      - name: Build frontend
        run: pnpm build

      - name: Verify staged Windows runtime
        working-directory: .
        shell: pwsh
        run: |
          python .\.github\scripts\verify-windows-runtime.py --runtime-root .\studio\runtime\ese --build-root .\build-package --cpu-build-root .\build-package-cpu
          if ($LASTEXITCODE -ne 0) { throw "Staged Windows runtime verification failed" }
          .\studio\runtime\ese\ese.exe doctor --json
          if ($LASTEXITCODE -ne 0) { throw "ESE runtime doctor failed" }

          $driverDll = Join-Path $env:SystemRoot "System32\nvcuda.dll"
          $hasNvidiaDriver = (Test-Path -LiteralPath $driverDll) -or [bool](Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue)
          if ($hasNvidiaDriver) {
            .\studio\runtime\ese\build\bin\llama-server.exe --version
            if ($LASTEXITCODE -ne 0) { throw "CUDA llama-server smoke test failed" }
          } else {
            Write-Host "NVIDIA driver unavailable; PE dependency checks passed and executable smoke test was skipped."
          }

      - name: Save verified Windows CUDA runtime build
        if: steps.windows-cuda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-package
          key: ${{ steps.windows-cuda-key.outputs.key }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Preserve verified Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: ese-windows-runtime-${{ github.sha }}
          path: studio/runtime/ese
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-msi:
    name: Windows MSI installer
    needs: windows-studio
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore verified Windows runtime
        uses: actions/download-artifact@v4
        with:
          name: ese-windows-runtime-${{ github.sha }}
          path: studio/runtime/ese

      - name: Verify restored runtime payload
        shell: pwsh
        working-directory: .
        run: |
          $required = @(
            '.\studio\runtime\ese\ese.exe',
            '.\studio\runtime\ese\build\bin\llama-server.exe',
            '.\studio\runtime\ese\build\bin\ese-runtime.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing runtime artifact: $path" }
          }
          $runtimeBin = './studio/runtime/ese/build/bin'
          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            if (-not (Get-ChildItem -Path (Join-Path $runtimeBin $pattern) -ErrorAction SilentlyContinue)) {
              throw "Missing CUDA runtime artifact matching: $pattern"
            }
          }

      - name: Build MSI installer
        id: build_msi
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: tauri_bundler=trace
        run: pnpm tauri build --bundles msi --config src-tauri/tauri.ci-bundle.conf.json

      - name: Upload WiX diagnostics
        if: always() && steps.build_msi.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ese-studio-wix-diagnostics-${{ github.run_id }}
          path: studio/src-tauri/target/release/wix
          if-no-files-found: warn

      - name: Require MSI build success
        if: steps.build_msi.outcome == 'failure'
        shell: pwsh
        run: throw 'MSI packaging failed; inspect the uploaded WiX diagnostics artifact.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ese-studio-windows-installer
          path: studio/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  windows-nsis:
    name: Windows NSIS installer
    needs: windows-studio
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore verified Windows runtime
        uses: actions/download-artifact@v4
        with:
          name: ese-windows-runtime-${{ github.sha }}
          path: studio/runtime/ese

      - name: Verify restored runtime payload
        shell: pwsh
        working-directory: .
        run: |
          $required = @(
            './studio/runtime/ese/ese.exe',
            './studio/runtime/ese/build/bin/llama-server.exe',
            './studio/runtime/ese/build/bin/ese-runtime.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing runtime artifact: $path" }
          }
          $runtimeBin = './studio/runtime/ese/build/bin'
          foreach ($pattern in @('cudart64_*.dll', 'cublas64_*.dll', 'cublasLt64_*.dll')) {
            if (-not (Get-ChildItem -Path (Join-Path $runtimeBin $pattern) -ErrorAction SilentlyContinue)) {
              throw "Missing CUDA runtime artifact matching: $pattern"
            }
          }

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci-bundle.conf.json

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ese-studio-windows-nsis-installer
          path: studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  collector:
    name: Benchmark collector and publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telemetry/collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: telemetry/collector/package-lock.json

      - name: Install locked collector dependencies
        run: npm ci

      - name: Check bindings, types, tests, and Worker bundle
        run: npm run check

      - name: Verify committed community benchmark rendering
        working-directory: .
        run: |
          node scripts/publish-community-benchmarks.mjs
          git diff --exit-code -- COMMUNITY_BENCHMARKS.md
