name: ESE unified CI

on:
  push:
    branches:
      - ese-unified
      - main
      - "phase1/**"
  pull_request:
    paths:
      - "ese"
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "THIRD_PARTY_PORTS.md"
      - "README.md"
      - "CMakeLists.txt"
      - "ggml/**"
      - "src/**"
      - "common/**"
      - "examples/server/**"
      - ".github/workflows/ese-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ese-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher and planner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python -m compileall -q ese tools tests

      - name: Unit tests and native surface guard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: CLI smoke
        run: |
          ./ese --help
          ./ese doctor --json

  turbo-kv-reference:
    name: Turbo KV CPU reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Build and test Turbo4/Turbo8 reference
        run: bash scripts/test-turbo-kv.sh


      - name: Configure internal GGML Turbo type test
        run: >-
          cmake -S . -B build-turbo-core
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_SERVER=OFF

      - name: Build internal GGML Turbo type test
        run: cmake --build build-turbo-core --target test-turbo-kv-core -j2

      - name: Run internal GGML Turbo type test
        run: build-turbo-core/bin/test-turbo-kv-core

  cpu-build:
    name: Native CPU server build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-ci
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_SERVER=ON

      - name: Build llama-server
        run: cmake --build build-ci --target llama-server -j2

      - name: Verify compiled policy surface
        shell: bash
        run: |
          # This ik_llama-derived server may return a non-zero status after
          # printing help. Treat the help text itself as the test artifact;
          # a missing/empty help page or missing required flag still fails CI.
          set +e
          build-ci/bin/llama-server --help > native-help.txt 2>&1
          help_rc=$?
          set -e

          if [[ ! -s native-help.txt ]]; then
            echo "llama-server produced no --help output (exit ${help_rc})"
            exit 1
          fi

          echo "llama-server --help exit code: ${help_rc}"
          for flag in --fit --cpu-moe --n-cpu-moe --defer-experts; do
            if ! grep -Fq -- "$flag" native-help.txt; then
              echo "Required native option is missing: $flag"
              echo "--- llama-server --help ---"
              cat native-help.txt
              exit 1
            fi
          done

          echo "Verified native ESE policy surface."
