    <text x="139" y="584" fill="#f4f6f4" font-size="36" font-weight="700" text-anchor="middle">SSD</text>
    <text x="380" y="584" fill="#f4f6f4" font-size="36" font-weight="700" text-anchor="middle">RAM</text>
    <text x="621" y="584" fill="#14251b" font-size="36" font-weight="700" text-anchor="middle">GPU</text>
    <text x="44" y="699" fill="#b6c4bd" font-size="22">MORE ROOM FOR SUPPORTED SPARSE MODELS</text>
