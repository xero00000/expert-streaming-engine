[package]
name = "ese-studio"
version = "0.1.0"
description = "Linux desktop control center for Expert Streaming Engine"
authors = ["ESE contributors"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/xero00000/expert-streaming-engine"
repository = "https://github.com/xero00000/expert-streaming-engine"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ese_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
portable-pty = "0.9"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
futures-util = "0.3"
fs2 = "0.4"
sha2 = "0.10"
