name: Research
description: Track new technical research area
title: "Research: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed ESE issues before starting a new research ticket.

  - type: checkboxes
    id: research-stage
    attributes:
      label: Research Stage
      description: Track general state of this research ticket
      options:
        - label: Background research (avoid reinventing the wheel)
        - label: Hypothesis formed (expected behavior and effect)
        - label: Strategy / Implementation Forming
        - label: Analysis of results
        - label: Debrief / Documentation (So people in the future can learn from us)

  - type: textarea
    id: background
    attributes:
      label: Previous existing literature and research
      description: What is the current state of the art, and what motivates this research?

  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: How do you think this will work, and what effect do you expect?

  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Got an approach? e.g. a PR ready to go?

  - type: textarea
    id: analysis
    attributes:
      label: Analysis
      description: How does the proposed implementation behave?

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
