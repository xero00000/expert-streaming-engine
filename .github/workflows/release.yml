name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-studio:
    name: Build Linux Studio packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Studio version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./studio/package.json').version")"
          tauri_version="$(node -p "require('./studio/src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' studio/src-tauri/Cargo.toml | head -n1)"
          test "$package_version" = "$expected"
          test "$tauri_version" = "$expected"
          test "$cargo_version" = "$expected"

      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          desktop-file-utils
          patchelf
          rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Build bundled ESE CPU runtime
        run: >-
          cmake -S . -B build-release-runtime
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_SERVER=ON
          && cmake --build build-release-runtime --target llama-server -j2

      - name: Build packages
        working-directory: studio
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare Linux assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          cp studio/src-tauri/target/release/bundle/deb/*.deb "release-assets/ese-studio_${version}_amd64.deb"
          cp studio/src-tauri/target/release/bundle/rpm/*.rpm "release-assets/ese-studio-${version}-1.x86_64.rpm"
          cp studio/src-tauri/target/release/bundle/appimage/*.AppImage "release-assets/ese-studio_${version}_amd64.AppImage"
          cp studio/src-tauri/target/release/bundle/appimage/*.AppImage.sig "release-assets/ese-studio_${version}_amd64.AppImage.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  windows-studio:
    name: Build Windows Studio installers
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Studio version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:RELEASE_TAG.Substring(1)
          $packageVersion = node -p "require('./studio/package.json').version"
          $tauriVersion = node -p "require('./studio/src-tauri/tauri.conf.json').version"
          $cargoVersion = (Select-String -Path studio/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($packageVersion -ne $expected -or $tauriVersion -ne $expected -or $cargoVersion -ne $expected) { throw "Release versions do not match $env:RELEASE_TAG" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA toolkit
        shell: pwsh
        run: .\.github\scripts\setup-cuda-windows.ps1

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Build bundled ESE CPU + CUDA runtime
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build-release-runtime -G "Ninja Multi-Config" -DGGML_CUDA=ON -DGGML_NATIVE=OFF "-DCMAKE_CUDA_ARCHITECTURES=61;70;75;80;86;89" -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build-release-runtime --config Release --target llama-server -j 4

      - name: Build standalone Windows ESE launcher
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
          python -m PyInstaller --noconfirm --clean --onefile --name ese --paths . --hidden-import tools.ese --distpath dist --workpath build-pyinstaller --specpath build-pyinstaller ese
          .\dist\ese.exe --version

      - name: Build installers
        working-directory: studio
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis,msi

      - name: Verify CUDA runtime in installer staging
        shell: pwsh
        run: |
          if (-not (Get-ChildItem studio\runtime\ese\build\bin\cudart64_*.dll)) { throw "CUDA runtime was not staged" }
          if (-not (Get-ChildItem studio\runtime\ese\build\bin\cublas64_*.dll)) { throw "cuBLAS runtime was not staged" }
          if ((Get-Content studio\runtime\ese\build\bin\ese-runtime.json | ConvertFrom-Json).cuda -ne $true) { throw "CUDA runtime manifest was not staged" }
          if (-not (Select-String -Path build-release-runtime\CMakeCache.txt -Pattern '^GGML_CUDA:BOOL=ON$')) { throw "runtime was not configured with CUDA" }
          .\studio\runtime\ese\ese.exe doctor --json
          .\studio\runtime\ese\build\bin\llama-server.exe --version

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory release-assets | Out-Null
          Copy-Item (Get-ChildItem studio\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1) "release-assets\ese-studio_${version}_x64-setup.exe"
          Copy-Item (Get-ChildItem studio\src-tauri\target\release\bundle\nsis\*.exe.sig | Select-Object -First 1) "release-assets\ese-studio_${version}_x64-setup.exe.sig"
          Copy-Item (Get-ChildItem studio\src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1) "release-assets\ese-studio_${version}_x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux-studio, windows-studio]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum -- *.AppImage *.deb *.rpm *.exe *.msi > SHA256SUMS
          sha256sum -- *.exe *.msi > SHA256SUMS-windows.txt

      - name: Generate signed updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          linux_signature="$(cat "release-assets/ese-studio_${version}_amd64.AppImage.sig")"
          windows_signature="$(cat "release-assets/ese-studio_${version}_x64-setup.exe.sig")"
          jq -n \
            --arg version "$version" \
            --arg notes "Expert Streaming Engine ${RELEASE_TAG}" \
            --arg pub_date "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_url "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/ese-studio_${version}_amd64.AppImage" \
            --arg linux_signature "$linux_signature" \
            --arg windows_url "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/ese-studio_${version}_x64-setup.exe" \
            --arg windows_signature "$windows_signature" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {url: $linux_url, signature: $linux_signature}, "windows-x86_64": {url: $windows_url, signature: $windows_signature}}}' \
            > release-assets/latest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Expert Streaming Engine ${RELEASE_TAG}" \
            --notes-file "$notes"
