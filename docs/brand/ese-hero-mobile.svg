      <rect x="44" y="509" width="190" height="120" rx="12"/>
      <rect x="285" y="509" width="190" height="120" rx="12"/>
      <rect x="526" y="509" width="190" height="120" rx="12" fill="#a7f3ce" stroke="#a7f3ce"/>
