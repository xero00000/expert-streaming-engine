name: Phase 1 Turbo KV core runner

on:
  pull_request:
    branches:
      - chunked-gdn-port

permissions:
  contents: write

concurrency:
  group: phase1-turbo-core-runner
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/turbo-kv-foundation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run corrected strict core integration patch
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import re
          import zlib

          workflow = Path('.github/workflows/phase1-core-bootstrap.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*PATCH_PAYLOAD:\s*([A-Za-z0-9+/=]+)\s*$', workflow, re.MULTILINE)
          if match is None:
              raise SystemExit('bootstrap payload was not found')

          script = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global script
              count = script.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              script = script.replace(old, new, 1)

          replace_once(
              '        "        ggml.cpp\\n",\n        "        ggml-turbo-kv.cpp\\n",',
              '        "            ggml.c\\n",\n        "            ggml-turbo-kv.cpp\\n",',
              'CMake source marker')
          replace_once(
              'namespace {\n\n[[noreturn]] void abort_adapter_failure() {',
              '[[noreturn]] static void abort_adapter_failure() {',
              'adapter helper scope')
          replace_once('\nsize_t checked_value_count(int64_t value_count) {',
                       '\nstatic size_t checked_value_count(int64_t value_count) {',
                       'checked value helper')
          replace_once('\nsize_t checked_total_value_count(int64_t nrows, int64_t n_per_row) {',
                       '\nstatic size_t checked_total_value_count(int64_t nrows, int64_t n_per_row) {',
                       'checked total helper')
          replace_once('\nvoid require_adapter_status(enum ggml_turbo_kv_status status) {',
                       '\nstatic void require_adapter_status(enum ggml_turbo_kv_status status) {',
                       'status helper')
          replace_once('\nvoid adapter_to_float(\n', '\nstatic void adapter_to_float(\n', 'decode helper')
          replace_once('\nvoid adapter_from_float(\n', '\nstatic void adapter_from_float(\n', 'encode helper')
          replace_once('\nsize_t adapter_quantize_rows(\n', '\nstatic size_t adapter_quantize_rows(\n', 'row helper')
          replace_once('\n} // namespace\n\nvoid ggml_turbo4_to_float',
                       '\nvoid ggml_turbo4_to_float',
                       'adapter namespace close')

          exec(compile(script, '<turbo-core-bootstrap>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Check generated patch
        run: |
          git diff --check
          git status --short

      - name: Run standalone Turbo reference test
        run: bash scripts/test-turbo-kv.sh

      - name: Run staged-visibility regression test
        run: python -m unittest tests/test_turbo_kv_visibility.py -v

      - name: Configure internal GGML core test
        run: >-
          cmake -S . -B build-turbo-core
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_SERVER=OFF

      - name: Build internal GGML core test
        run: cmake --build build-turbo-core --target test-turbo-kv-core -j2

      - name: Run internal GGML core test
        run: build-turbo-core/bin/test-turbo-kv-core

      - name: Commit validated integration
        run: |
          rm .github/workflows/phase1-core-bootstrap.yml
          rm .github/workflows/phase1-core-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(turbo-kv): integrate internal GGML types and dispatch'
          git push origin HEAD:phase1/turbo-kv-foundation
