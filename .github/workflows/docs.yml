name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-docs.py"
      - "tools/ese.py"
      - "studio/package.json"
      - "studio/src-tauri/Cargo.toml"
      - "studio/src-tauri/tauri.conf.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Links, versions, and branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate maintained documentation
        run: python scripts/check-docs.py --check-remote-branches
