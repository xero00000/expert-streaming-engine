name: Phase 1 Turbo KV core bootstrap

on:
  push:
    branches:
      - phase1/turbo-kv-foundation
    paths:
      - .github/workflows/phase1-core-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: phase1-turbo-core-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event.head_commit.message == 'chore: bootstrap Turbo KV core integration'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/turbo-kv-foundation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply strict core integration patch
        env:
          PATCH_PAYLOAD: 
        run: |
          python - <<'PY'
          import base64
          import os
          import zlib
          payload = zlib.decompress(base64.b64decode(os.environ['PATCH_PAYLOAD']))
          exec(compile(payload, '<turbo-core-bootstrap>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Check generated patch
        run: |
          git diff --check
          git status --short

      - name: Run standalone Turbo reference test
        run: bash scripts/test-turbo-kv.sh

      - name: Run staged-visibility regression test
        run: python -m unittest tests/test_turbo_kv_visibility.py -v

      - name: Configure internal GGML core test
        run: >-
          cmake -S . -B build-turbo-core
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_SERVER=OFF

      - name: Build internal GGML core test
        run: cmake --build build-turbo-core --target test-turbo-kv-core -j2

      - name: Run internal GGML core test
        run: build-turbo-core/bin/test-turbo-kv-core

      - name: Commit validated generated integration
        run: |
          rm .github/workflows/phase1-core-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(turbo-kv): integrate internal GGML types and dispatch'
          git push origin HEAD:phase1/turbo-kv-foundation
